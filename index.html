            {번호:30, 이름:"피스", 품종:"래브라도", 성별:"암컷", 업무:"은퇴견", 소개:"얼굴이 작고 애교가 많아 언제나 귀여움을 보여주는 친구입니다. / 먹는 것을 좋아하며  간식이나 사료가 보이면 바로 달려오는 귀여운 모습을 보여줍니다. / 장난감 중 공을 가장 좋아하며  그렇기에 공놀이를 매우…"},

            {번호:39, 이름:"제리", 품종:"말리노이즈", 성별:"수컷", 업무:"폭발물 탐지견", 소개:"사람을 엄청 좋아하며  만져주면 배를 까면서 누워 엄청난 애교를 보이는 애교쟁이입니다. / 야외 활동을 정말 좋아하고  야외 활동을 자주하면  집에서는 얌전히 있습니다. / 공놀이를 엄청 좋아합니다. 다만  너무…"},

            {번호:75, 이름:"여름", 품종:"래브라도", 성별:"수컷", 업무:"은퇴견", 소개:""},
            {번호:76, 이름:"가을", 품종:"래브라도", 성별:"암컷", 업무:"은퇴견", 소개:""},
            {번호:77, 이름:"겨울", 품종:"래브라도", 성별:"수컷", 업무:"은퇴견", 소개:""},
            {번호:78, 이름:"단풍", 품종:"래브라도", 성별:"암컷", 업무:"은퇴견", 소개:""},
            {번호:79, 이름:"은행", 품종:"래브라도", 성별:"수컷", 업무:"은퇴견", 소개:""},
            {번호:80, 이름:"설악", 품종:"말리노이즈", 성별:"수컷", 업무:"폭발물 탐지견", 소개:""},
            {번호:81, 이름:"한라", 품종:"말리노이즈", 성별:"암컷", 업무:"폭발물 탐지견", 소개:""},
            {번호:82, 이름:"지리", 품종:"말리노이즈", 성별:"수컷", 업무:"폭발물 탐지견", 소개:""},
            {번호:83, 이름:"백두", 품종:"말리노이즈", 성별:"수컷", 업무:"폭발물 탐지견", 소개:""},
            {번호:84, 이름:"금강", 품종:"말리노이즈", 성별:"수컷", 업무:"폭발물 탐지견", 소개:""}
        ];

        // Base Breed Ratings: [활동량, 초보친화, 동물친화]
        const BREED_STATS = {
            "래브라도": [3, 5, 4],
            "비글": [4, 4, 5],
            "말리노이즈": [5, 1, 3],
            "셰퍼드": [4, 2, 3],
            "스프링어": [5, 3, 4],
            "기타": [2, 3, 3]
        };

        // Questions & Options
        const QUESTIONS = [
            {
                title: "1. 하루 산책은 얼마나 할 수 있어? 🦮",
                options: [
                    { label: "30분 정도 소소하게", val: 2 },
                    { label: "1시간 정도 알차게", val: 3 },
                    { label: "2시간 이상 쌩쌩하게!", val: 5 }
                ]
            },
            {
                title: "2. 함께 살 집은 어떤 곳이야? 🏠",
                options: [
                    { label: "아파트 · 빌라", val: "apartment" },
                    { label: "마당이 있는 주택", val: "house" }
                ]
            },
            {
                title: "3. 집에 다른 반려동물이 있어? 🐱",
                options: [
                    { label: "네, 함께 살고 있어요", val: true },
                    { label: "아니요, 없어요", val: false }
                ]
            },
            {
                title: "4. 강아지를 키워 본 경험은? 🐕",
                options: [
                    { label: "처음 키워봐요 (초보)", val: 1 },
                    { label: "키워 본 적 있어요 (경험자)", val: 3 },
                    { label: "훈련도 자신 있어요! (전문가)", val: 5 }
                ]
            },
            {
                title: "5. 어떤 성격의 친구를 원해? ❤️",
                options: [
                    { label: "애교 많고 무릎에 안기는 애교쟁이", val: "cuddle" },
                    { label: "차분하고 얌전한 힐링 친구", val: "calm" },
                    { label: "에너지 넘치는 신나는 놀이 친구", val: "play" }
                ]
            }
        ];

        let currentQuestionIdx = 0;
        let userAnswers = [];

        // Update dog count automatically on load
        document.getElementById('dogCountText').textContent = `기다리는 친구 ${DOGS.length}마리`;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startQuiz() {
            currentQuestionIdx = 0;
            userAnswers = [];
            showScreen('questionScreen');
            renderQuestion();
        }

        function renderQuestion() {
            const q = QUESTIONS[currentQuestionIdx];
            document.getElementById('questionTitle').textContent = q.title;

            // Update Progress
            const progressPct = ((currentQuestionIdx + 1) / QUESTIONS.length) * 100;
            document.getElementById('progressFill').style.width = `${progressPct}%`;
            document.getElementById('progressText').textContent = `${currentQuestionIdx + 1}/${QUESTIONS.length}`;

            // Toggle Previous Button visibility
            document.getElementById('prevBtn').style.visibility = currentQuestionIdx === 0 ? 'hidden' : 'visible';

            // Render Option Buttons
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerHTML = `<span>${opt.label}</span><span>➔</span>`;
                btn.onclick = () => selectOption(opt.val);
                container.appendChild(btn);
            });
        }

        function selectOption(val) {
            userAnswers[currentQuestionIdx] = val;
            if (currentQuestionIdx < QUESTIONS.length - 1) {
                currentQuestionIdx++;
                renderQuestion();
            } else {
                calculateAndShowResults();
            }
        }

        function prevQuestion() {
            if (currentQuestionIdx > 0) {
                currentQuestionIdx--;
                renderQuestion();
            }
        }

        function restartQuiz() {
            showScreen('startScreen');
        }

        // Calculate Compatibility Score & Traits
        function calculateAndShowResults() {
            const [walkVal, houseVal, hasPet, expVal, prefPersonality] = userAnswers;

            const scoredDogs = DOGS.map(dog => {
                const base = BREED_STATS[dog.품종] || BREED_STATS["기타"];
                let activity = base[0];
                let noviceScore = base[1];
                let petScore = base[2];

                let tags = [];
                let warningMsg = "";

                // Intro Text Feature Extraction
                const intro = dog.소개 || "";
                if (/[활발|에너지|뛰어]/.test(intro)) {
                    activity = Math.min(5, activity + 1);
                    tags.push("🏃 에너지 뿜뿜");
                }
                if (/[차분|조용|온순|순한]/.test(intro)) {
                    activity = Math.max(1, activity - 1);
                    tags.push("🛋️ 차분한 편");
                }
                if (/[애교|안기|배를]/.test(intro)) {
                    tags.push("💕 애교쟁이");
                }
                if (/[겁|낯|소심]/.test(intro)) {
                    warningMsg = "💡 새 환경에 천천히 적응해요";
                }

                // Score Calculation (Starts at 100)
                let score = 100;
                let matchReasons = [];

                // 1. Walk Difference
                const walkDiff = Math.abs(walkVal - activity);
                score -= walkDiff * 10;
                if (walkDiff <= 1) {
                    matchReasons.push("보호자님의 산책 스타일과 활동량이 딱 맞아요!");
                }

                // 2. Housing
                if (houseVal === "apartment" && activity === 5) {
                    score -= 10;
                } else if (houseVal === "house" && activity >= 4) {
                    score += 5;
                    matchReasons.push("넓은 마당에서 신나게 뛰어놀기 이상적인 환경이에요.");
                }

                // 3. Existing Pet
                if (hasPet) {
                    score -= (5 - petScore) * 6;
                    if (petScore >= 4) {
                        matchReasons.push("다른 반려동물과도 둥글둥글 잘 어울리는 성격이에요.");
                    }
                }

                // 4. Experience Level
                const reqExp = 6 - noviceScore;
                if (expVal < reqExp) {
                    score -= (reqExp - expVal) * 8;
                } else {
                    matchReasons.push("보호자님의 반려견 케어 경험으로 충분히 잘 돌보실 수 있어요.");
                }

                // 5. Personality Preference
                if (prefPersonality === "cuddle" && tags.includes("💕 애교쟁이")) {
                    score += 10;
                    matchReasons.push("원하시는 사랑스러운 애교쟁이 성향을 가졌어요.");
                }
                if (prefPersonality === "calm" && tags.includes("🛋️ 차분한 편")) {
                    score += 10;
                    matchReasons.push("원하시는 차분하고 얌전한 성격의 짝꿍이에요.");
                }
                if (prefPersonality === "play" && activity >= 4) {
                    score += 10;
                    matchReasons.push("지치지 않고 함께 재미있게 놀아줄 텐션 높은 친구예요.");
                }

                // Clamp score between 40 and 99
                score = Math.max(40, Math.min(99, score));

                // Fallback reason if none triggered
                if (matchReasons.length === 0) {
                    matchReasons.push("보호자님의 생활 패턴과 온순하게 잘 어우러질 수 있어요.");
                }

                return {
                    ...dog,
                    score,
                    tags,
                    warningMsg,
                    matchReasons: matchReasons.slice(0, 2)
                };
            });

            // Sort by score descending
            scoredDogs.sort((a, b) => b.score - a.score);

            // Display Top 3
            const top3 = scoredDogs.slice(0, 3);
            renderResults(top3);
            showScreen('resultScreen');
        }

        function getBreedEmoji(breed) {
            switch(breed) {
                case "래브라도": return "🦮";
                case "비글": return "🐶";
                case "말리노이즈": return "🐕‍🦺";
                case "셰퍼드": return "🐕";
                case "스프링어": return "🐾";
                default: return "🐩";
            }
        }

        function renderResults(topDogs) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            topDogs.forEach((dog, idx) => {
                const card = document.createElement('div');
                card.className = 'card';

                const emoji = getBreedEmoji(dog.품종);
                const introText = dog.소개 ? dog.소개 : "아직 소개글이 없어요 ✍️";

                let tagsHTML = dog.tags.map(t => `<span class="tag">${t}</span>`).join('');
                if (dog.warningMsg) {
                    tagsHTML += `<span class="tag tag-warning">${dog.warningMsg}</span>`;
                }

                let reasonsHTML = dog.matchReasons.map(r => `<div>• <strong>이래서 잘 맞아요:</strong> ${r}</div>`).join('');

                card.innerHTML = `
                    <div class="card-top">
                        <div class="dog-avatar">${emoji}</div>
                        <div class="dog-info">
                            <div class="dog-name">${idx + 1}위. ${dog.이름}</div>
                            <div class="dog-meta">${dog.품종} · ${dog.성별} · ${dog.업무}</div>
                        </div>
                        <div class="score-badge">
                            ${dog.score}<span style="font-size: 0.8rem">%</span>
                            <span class="score-label">궁합점수</span>
                        </div>
                    </div>

                    ${tagsHTML ? `<div class="tags-container">${tagsHTML}</div>` : ''}

                    <div class="match-reason">
                        ${reasonsHTML}
                    </div>

                    <div class="dog-intro">
                        ${introText}
                    </div>
                `;

                container.appendChild(card);
            });
        }
    </script>
